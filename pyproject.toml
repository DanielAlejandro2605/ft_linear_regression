[project]
name = "ft-linear-regression"
version = "0.1.0"
description = "Linear regression implementation for car price prediction"
authors = [
    {name = "Daniel Nieto", email = "dnieto-c@42.student.fr"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]
