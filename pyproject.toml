[project]
name = "ft-linear-regression"
version = "0.1.0"
description = "Linear regression implementation for car price prediction"
authors = [
    {name = "Daniel Nieto", email = "dnieto-c@42.student.fr"}
]
requires-python = ">=3.10"
dependencies = [
    "blinker==1.4",
    "contourpy==1.2.1",
    "cursor==1.3.5",
    "cycler==0.12.1",
    "fonttools==4.53.1",
    "kiwisolver==1.4.5",
    "matplotlib==3.9.2",
    "numpy==2.1.0",
    "packaging==24.1",
    "pandas==2.2.2",
    "pillow==10.4.0",
    "pyparsing==3.1.4",
    "python-dateutil==2.9.0.post0",
    "python-signal==0.0.2",
    "pytz==2024.1",
    "six==1.16.0",
    "tzdata==2024.1",
    "imageio==2.34.0",
    "imageio-ffmpeg==0.4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]
